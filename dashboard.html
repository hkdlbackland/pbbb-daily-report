      var bk = baseEntry + Math.round(baseEntry * 0.05 * rand());
      totalEntry += baseEntry; totalAlbum += albumSold; totalSB += storybookSold; totalRevenue += rev; totalBookings += bk;
    }
    var totalBookSold = totalAlbum + totalSB;
    var convRate = totalEntry > 0 ? totalBookSold / totalEntry : 0;
    var perCap = Math.round(totalRevenue / Math.max(totalBookings, 1));
    return { name, entry: totalEntry, albumSold: totalAlbum, storybookSold: totalSB, totalBookSold, convRate, revenue: totalRevenue, bookings: totalBookings, perCap };

}

function ICPerformanceRanking({ icList, allMonths }) {
  var [icPeriod, setICPeriod] = useState("month");
  var [rankBy, setRankBy] = useState("convRate");
  var [icYear, setICYear] = useState(2026);
  var [icMon, setICMon] = useState(9);
  var availableYears = useMemo(() => { var s = {}; allMonths.forEach(d => { s[d.year] = true; }); return Object.keys(s).map(Number).sort((a, b) => b - a); }, [allMonths]);
  var monthsForICYear = useMemo(() => { return allMonths.filter(d => d.year === icYear).map(d => d.month).sort((a, b) => a - b); }, [allMonths, icYear]);
  function handleICYearChange(ny) { setICYear(ny); var av = allMonths.filter(d => d.year === ny).map(d => d.month); if (av.indexOf(icMon) === -1) setICMon(av[av.length - 1] || 1); }
  var icData = useMemo(() => { if (icPeriod === "month") { return generateICBizData(icList, icYear, icMon); } else { return generateICYearData(icList, icYear); } }, [icList, icYear, icMon, icPeriod]);
  var prevICData = useMemo(() => { if (icPeriod === "month") { var pm = icMon === 1 ? 12 : icMon - 1; var py = icMon === 1 ? icYear - 1 : icYear; return generateICBizData(icList, py, pm); } else { return generateICYearData(icList, icYear - 1); } }, [icList, icYear, icMon, icPeriod]);
  var ranked = useMemo(() => { var sorted = [...icData].sort((a, b) => { if (rankBy === "convRate") return b.convRate - a.convRate; if (rankBy === "revenue") return b.revenue - a.revenue; return b.perCap - a.perCap; }); return sorted; }, [icData, rankBy]);
  var medalColors = ["#f59e0b", "#94a3b8", "#cd7f32"];
  var periodLabel = icPeriod === "month" ? icYear + "年" + MONTH_NAMES[icMon] : icYear + "年 全年";
  var prevLabel = icPeriod === "month" ? "上月" : "上年";
  var dropdownStyle = "border-2 border-violet-200 rounded-xl px-3 py-2 text-sm font-bold bg-violet-50 focus:outline-none focus:ring-2 focus:ring-violet-300 appearance-none";
  if (icList.length === 0) return (<div className="bg-gray-50 rounded-2xl p-8 text-center border-2 border-dashed border-gray-200"><div className="text-3xl mb-2">👤</div><div className="text-sm text-gray-400">未有 IC 名單，請先新增</div></div>);
  return (
    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <div className="px-4 py-3 bg-gradient-to-r from-violet-50 to-purple-50 border-b border-violet-200"><div className="flex items-center gap-2"><div className="w-8 h-8 rounded-xl bg-violet-200 flex items-center justify-center"><Shield className="w-4 h-4 text-violet-600" /></div><div><div className="text-sm font-black text-violet-700">🏆 IC 表現排名</div><div className="text-xs text-violet-400">僅你可見</div></div></div></div>
      <div className="px-4 pt-3 space-y-2.5">
        <div className="flex items-center gap-2 flex-wrap">
          <div className="flex gap-1 bg-gray-100 p-1 rounded-xl shrink-0">{[{ key: "month", label: "📅 月" }, { key: "year", label: "📆 年" }].map(t => (<button key={t.key} onClick={() => setICPeriod(t.key)} className={icPeriod === t.key ? "px-3 py-2 rounded-lg text-xs font-bold bg-white text-violet-600 shadow-sm" : "px-3 py-2 rounded-lg text-xs font-bold text-gray-400"}>{t.label}</button>))}</div>
          <div className="flex gap-2 items-center flex-1 justify-end"><select value={icYear} onChange={e => handleICYearChange(parseInt(e.target.value))} className={dropdownStyle}>{availableYears.map(y => <option key={y} value={y}>{y}年</option>)}</select>{icPeriod === "month" && (<select value={icMon} onChange={e => setICMon(parseInt(e.target.value))} className={dropdownStyle}>{monthsForICYear.map(m => <option key={m} value={m}>{m}月</option>)}</select>)}</div>
        </div>
        <div className="text-xs font-bold text-violet-500 bg-violet-50 rounded-lg px-3 py-2 border border-violet-200 flex items-center gap-2">📅 {periodLabel}<span className="text-violet-300">|</span><span className="text-violet-400">對比：{prevLabel}</span></div>
        <div className="flex gap-1.5 bg-violet-50 p-1 rounded-xl">{[{ key: "convRate", label: "📈 相簿轉化率" }, { key: "revenue", label: "💰 帳面數字" }, { key: "perCap", label: "💵 Per Cap" }].map(t => (<button key={t.key} onClick={() => setRankBy(t.key)} className={rankBy === t.key ? "flex-1 py-2 rounded-lg text-xs font-bold bg-white text-violet-600 shadow-sm" : "flex-1 py-2 rounded-lg text-xs font-bold text-violet-300"}>{t.label}</button>))}</div>
      </div>
      <div className="px-4 py-4 space-y-3">
        {ranked.map((ic, i) => {
          var prevIC = prevICData.find(p => p.name === ic.name);
          var mainVal = rankBy === "convRate" ? ic.convRate : rankBy === "revenue" ? ic.revenue : ic.perCap;
          var mainDisplay = rankBy === "convRate" ? formatPct(ic.convRate) : rankBy === "revenue" ? formatMoney(ic.revenue) : formatMoney(ic.perCap);
          var prevMainVal = prevIC ? (rankBy === "convRate" ? prevIC.convRate : rankBy === "revenue" ? prevIC.revenue : prevIC.perCap) : null;
          var maxConv = Math.max(...ranked.map(r => r.convRate), 0.01);
          var maxRev = Math.max(...ranked.map(r => r.revenue), 1);
          var maxPC = Math.max(...ranked.map(r => r.perCap), 1);
          var barW = rankBy === "convRate" ? Math.max((ic.convRate / maxConv) * 100, 5) : rankBy === "revenue" ? Math.max((ic.revenue / maxRev) * 100, 5) : Math.max((ic.perCap / maxPC) * 100, 5);

    var cy = selYear; var ly = selYear - 1; var cyMs = allMonths.filter(d => d.year === cy); var lyMs = allMonths.filter(d => d.year === ly);
    var revenueChart = []; for (var i = 1; i <= 12; i++) { var cM = cyMs.find(d => d.month === i); var lM = lyMs.find(d => d.month === i); revenueChart.push({ name: MONTH_NAMES[i], cur: cM ? cM.revenue : 0, prev: lM ? lM.revenue : 0 }); }
    return (<div className="space-y-4"><div className="flex items-center justify-between"><h2 className="text-lg font-black text-gray-700">📈 YoY 比較</h2><select value={selYear} onChange={e => handleYearChange(parseInt(e.target.value))} className="border-2 border-pink-200 rounded-xl px-3 py-2 text-sm font-bold bg-pink-50">{availableYears.map(y => <option key={y} value={y}>{y}年</option>)}</select></div><div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><div className="font-bold text-sm text-gray-700 mb-3">💰 月營收 YoY ({cy} vs {ly})</div><ResponsiveContainer width="100%" height={220}><LineChart data={revenueChart}><CartesianGrid strokeDasharray="3 3" stroke="#f3f4f6" /><XAxis dataKey="name" tick={{ fontSize: 9 }} /><YAxis tick={{ fontSize: 10 }} tickFormatter={v => Math.round(v / 1000) + "k"} /><Tooltip formatter={v => ["$" + v.toLocaleString()]} /><Legend /><Line type="monotone" dataKey="cur" name={String(cy)} stroke="#f43f5e" strokeWidth={2.5} dot={{ r: 3, fill: "#f43f5e" }} /><Line type="monotone" dataKey="prev" name={String(ly)} stroke="#fda4af" strokeWidth={2} dot={{ r: 2.5, fill: "#fda4af" }} strokeDasharray="6 3" /></LineChart></ResponsiveContainer></div><div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><div className="font-bold text-sm text-gray-700 mb-3">📋 逐月對比</div><table className="w-full text-xs"><thead><tr className="bg-gray-50"><th className="p-2 text-left">月</th><th className="p-2 text-right">{cy}</th><th className="p-2 text-right">{ly}</th><th className="p-2 text-right">變化</th></tr></thead><tbody>{Array.from({ length: 12 }, (_, i) => { var m = i + 1; var cM2 = cyMs.find(d => d.month === m); var lM2 = lyMs.find(d => d.month === m); return (<tr key={m} className="border-t border-gray-100"><td className="p-2 font-bold">{MONTH_NAMES[m]}</td><td className="p-2 text-right">{cM2 ? formatMoney(cM2.revenue) : "—"}</td><td className="p-2 text-right">{lM2 ? formatMoney(lM2.revenue) : "—"}</td><td className="p-2 text-right">{cM2 && lM2 ? <MomBadge current={cM2.revenue} previous={lM2.revenue} /> : "—"}</td></tr>); })}</tbody></table></div></div>);
  }

  function renderSettings() {
    if (!settingsUnlocked) { return <PasswordGate onUnlock={() => setSettingsUnlocked(true)} />; }
    return (
      <div className="space-y-5">
        <div className="flex items-center justify-between"><h2 className="text-lg font-black text-gray-700">⚙️ 設定</h2><button onClick={() => setSettingsUnlocked(false)} className="flex items-center gap-1.5 text-xs font-bold text-gray-400 bg-gray-100 px-3 py-1.5 rounded-lg hover:bg-gray-200 transition-all"><Lock className="w-3.5 h-3.5" /><span>鎖定</span></button></div>
        <div className="bg-gradient-to-r from-emerald-50 to-teal-50 rounded-xl px-4 py-2.5 border border-emerald-200 flex items-center gap-2"><Unlock className="w-4 h-4 text-emerald-500" /><span className="text-sm font-bold text-emerald-600">已解鎖</span></div>
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <div className="flex items-center gap-2 mb-4"><div className="w-8 h-8 rounded-xl bg-gradient-to-br from-rose-400 to-pink-400 flex items-center justify-center text-white text-sm">👥</div><div><div className="font-bold text-base text-gray-700">同事名單</div><div className="text-xs text-gray-400">{staffList.length} 位同事</div></div></div>
          <div className="space-y-2 mb-3">{staffList.map(name => (<div key={name} className="flex items-center justify-between bg-gray-50 rounded-xl px-4 py-3"><div className="flex items-center gap-3"><div className="w-8 h-8 rounded-lg bg-gradient-to-br from-rose-400 to-pink-400 flex items-center justify-center text-white font-bold text-sm">{name[0]}</div><span className="font-semibold text-sm">{name}</span></div><button onClick={() => setStaffList(staffList.filter(x => x !== name))} className="w-8 h-8 rounded-lg bg-red-50 text-red-400 flex items-center justify-center hover:bg-red-100 transition-all">✕</button></div>))}</div>
          <div className="flex gap-2"><input value={newStaffName} onChange={e => setNewStaffName(e.target.value)} placeholder="新同事名..." className="flex-1 border-2 border-pink-200 rounded-xl px-3 py-2.5 text-sm bg-pink-50 focus:outline-none focus:ring-2 focus:ring-rose-300" onKeyDown={e => { if (e.key === "Enter" && newStaffName.trim()) { setStaffList(staffList.concat([newStaffName.trim()])); setNewStaffName(""); } }} /><button onClick={() => { if (newStaffName.trim()) { setStaffList(staffList.concat([newStaffName.trim()])); setNewStaffName(""); } }} className="bg-gradient-to-r from-rose-400 to-pink-400 text-white font-bold px-4 py-2.5 rounded-xl shadow-sm hover:shadow-md transition-all">+ 加</button></div>
        </div>
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <div className="flex items-center gap-2 mb-4"><div className="w-8 h-8 rounded-xl bg-gradient-to-br from-violet-400 to-purple-400 flex items-center justify-center text-white text-sm"><Shield className="w-4 h-4" /></div><div><div className="font-bold text-base text-gray-700">IC 名單</div><div className="text-xs text-gray-400">{icList.length} 位 IC</div></div></div>
          <div className="space-y-2 mb-3">{icList.map(name => (<div key={name} className="flex items-center justify-between bg-violet-50 rounded-xl px-4 py-3"><div className="flex items-center gap-3"><div className="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-400 to-purple-400 flex items-center justify-center text-white font-bold text-sm">{name[0]}</div><span className="font-semibold text-sm text-violet-700">{name}</span></div><button onClick={() => setICList(icList.filter(x => x !== name))} className="w-8 h-8 rounded-lg bg-red-50 text-red-400 flex items-center justify-center hover:bg-red-100 transition-all">✕</button></div>))}</div>
          <div className="flex gap-2"><input value={newICName} onChange={e => setNewICName(e.target.value)} placeholder="新 IC 名..." className="flex-1 border-2 border-violet-200 rounded-xl px-3 py-2.5 text-sm bg-violet-50 focus:outline-none focus:ring-2 focus:ring-violet-300" onKeyDown={e => { if (e.key === "Enter" && newICName.trim()) { setICList(icList.concat([newICName.trim()])); setNewICName(""); } }} /><button onClick={() => { if (newICName.trim()) { setICList(icList.concat([newICName.trim()])); setNewICName(""); } }} className="bg-gradient-to-r from-violet-400 to-purple-400 text-white font-bold px-4 py-2.5 rounded-xl shadow-sm hover:shadow-md transition-all">+ 加</button></div>
        </div>
        <ICPerformanceRanking icList={icList} allMonths={allMonths} />
      </div>
    );
  }

  var TABS = [
    { id: "overview", icon: "📊", label: "總覽" },
    { id: "staff", icon: "👤", label: "同事" },
    { id: "details", icon: "📋", label: "明細" },
    { id: "annual", icon: "📅", label: "年度" },
    { id: "yoy", icon: "📈", label: "YoY" },
    { id: "settings", icon: "⚙️", label: "設定" }
  ];

  return (
    <div className="min-h-screen bg-gray-50">
      <div className="px-5 pt-6 pb-8 text-white relative overflow-hidden" style={{ background: "linear-gradient(135deg, #f9a8d4, #fb7185, #f472b6)" }}>
        <div className="absolute top-0 right-0 w-40 h-40 bg-white opacity-10 rounded-full" style={{ transform: "translate(30px, -30px)" }} />
        <div className="relative max-w-2xl mx-auto"><div className="text-xs opacity-70 tracking-wider mb-1">👑 PRINCESS BEAUTY BOUTIQUE</div><div className="text-xl font-extrabold">PBBB Dashboard</div><div className="text-xs opacity-50">公主化妝廳 · 後台分析</div></div>
      </div>
      <div className="sticky top-0 z-40 bg-white border-b border-gray-200 overflow-x-auto">
        <div className="flex gap-1 px-3 py-2" style={{ minWidth: "max-content" }}>
          {TABS.map(t => (<button key={t.id} onClick={() => setActiveTab(t.id)} className={activeTab === t.id ? "px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap bg-gradient-to-r from-rose-400 to-pink-400 text-white shadow" : "px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap text-gray-500 hover:bg-gray-100"}>{t.icon} {t.label}</button>))}
        </div>
      </div>
      <div className="max-w-4xl mx-auto px-4 py-5">
        {activeTab === "overview" && renderOverview()}
        {activeTab === "staff" && renderStaff()}
        {activeTab === "details" && renderDetails()}
        {activeTab === "annual" && renderAnnual()}
        {activeTab === "yoy" && renderYoY()}
        {activeTab === "settings" && renderSettings()}
      </div>
    </div>
  );
}

/* ═══════ Render to DOM ═══════ */
ReactDOM.createRoot(document.getElementById("root")).render(<PBBBDashboard />);

  </script>
</body>
</html>
