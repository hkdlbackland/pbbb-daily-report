var ROLE_CONFIG={photo:{label:"📷 拍攝",criteria:PHOTO_CRITERIA,stroke:"#e11d48",fill:"#e11d48",bg:"from-rose-50 to-pink-50",border:"border-rose-200"},asst:{label:"🎀 助手",criteria:ASST_CRITERIA,stroke:"#d97706",fill:"#d97706",bg:"from-amber-50 to-orange-50",border:"border-amber-200"},sales:{label:"💼 銷售",criteria:SALES_CRITERIA,stroke:"#2563eb",fill:"#2563eb",bg:"from-blue-50 to-indigo-50",border:"border-blue-200"}};

const IC_STAFF_SORT_OPTIONS=[{key:"perCap",label:"Per Cap",icon:"💵",fmt:v=>"$"+v.toLocaleString()},{key:"avgScore",label:"平均評分",icon:"⭐",fmt:v=>v.toFixed(1)},{key:"revenue",label:"營收",icon:"💰",fmt:v=>"$"+v.toLocaleString()},{key:"albumConv",label:"Album 轉化%",icon:"📕",fmt:v=>(v*100).toFixed(1)+"%"},{key:"sbConv",label:"SB 轉化%",icon:"📗",fmt:v=>(v*100).toFixed(1)+"%"}];

function formatMoney(n){return n==null?"—":"$"+n.toLocaleString()}
function formatNum(n){return n==null?"0":n.toLocaleString()}
function formatPct(n){return n==null?"—":(n*100).toFixed(1)+"%"}
function pctChange(c,p){if(!p||p===0)return null;return((c-p)/Math.abs(p))*100}
function getScoreColor(s){if(s>=4.5)return{color:"#059669",bg:"bg-emerald-50",border:"border-emerald-200",label:"優秀",text:"text-emerald-600"};if(s>=3.5)return{color:"#2563eb",bg:"bg-blue-50",border:"border-blue-200",label:"良好",text:"text-blue-600"};if(s>=2.5)return{color:"#d97706",bg:"bg-amber-50",border:"border-amber-200",label:"待改進",text:"text-amber-600"};return{color:"#dc2626",bg:"bg-red-50",border:"border-red-200",label:"需加強",text:"text-red-600"}}

function EmptyState({icon,title,subtitle}){return <div className="bg-white rounded-2xl p-10 text-center border-2 border-dashed border-gray-200"><div className="text-5xl mb-3">{icon||"📭"}</div><div className="text-base font-bold text-gray-400 mb-1">{title||"未有相關數據"}</div>{subtitle&&<div className="text-sm text-gray-300 leading-relaxed">{subtitle}</div>}</div>}
function ChangeBadge({pct,label}){if(pct==null)return null;var u=pct>=0;return <span className={"inline-flex items-center gap-0.5 text-xs font-bold px-1.5 py-0.5 rounded-full whitespace-nowrap "+(u?"bg-emerald-50 text-emerald-600":"bg-red-50 text-red-600")}>{label?label+" ":""}{u?"▲":"▼"}{Math.abs(pct).toFixed(1)}%</span>}
function MomBadge({current,previous,isPct,prevLabel,tag}){if(previous==null||previous===0)return null;var d=isPct?(current-previous)*100:((current-previous)/previous)*100;var u=d>=0;return <div className="flex flex-col gap-0.5 mt-0.5">{prevLabel&&<span className="text-xs text-gray-400">{tag||"上月"} <span className="font-bold text-gray-500">{prevLabel}</span></span>}<span className={u?"inline-flex items-center gap-0.5 text-xs font-bold px-1.5 py-0.5 rounded-full bg-emerald-50 text-emerald-600 w-fit":"inline-flex items-center gap-0.5 text-xs font-bold px-1.5 py-0.5 rounded-full bg-red-50 text-red-600 w-fit"}>{u?"▲":"▼"}{Math.abs(d).toFixed(1)}%</span></div>}
function KPICard({icon,label,value,subtitle,badges}){return <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><div className="text-2xl mb-1">{icon}</div><div className="text-xs text-gray-400 font-semibold mb-1">{label}</div><div className="text-lg font-black text-gray-800">{value}</div>{subtitle&&<div className="text-xs text-gray-400 mt-0.5">{subtitle}</div>}{badges}</div>}
function YearMonthSelector({selYear,selMon,years,monthsForYear,onYearChange,onMonthChange}){var ds="border-2 border-pink-200 rounded-xl px-3 py-2 text-sm font-bold bg-pink-50 focus:outline-none focus:ring-2 focus:ring-rose-300";if(!years||years.length===0)return null;return <div className="flex gap-2 items-center"><select value={selYear} onChange={e=>onYearChange(parseInt(e.target.value))} className={ds}>{years.map(y=><option key={y} value={y}>{y}年</option>)}</select><select value={selMon} onChange={e=>onMonthChange(parseInt(e.target.value))} className={ds}>{monthsForYear.map(m=><option key={m} value={m}>{m}月</option>)}</select></div>}
function CircleScore({score,size=56,color}){var r2=(size-8)/2,c=2*Math.PI*r2,o=c*(1-score/5);return <svg width={size} height={size}><circle cx={size/2} cy={size/2} r={r2} fill="none" stroke="#f3f4f6" strokeWidth={4}/><circle cx={size/2} cy={size/2} r={r2} fill="none" stroke={color} strokeWidth={4} strokeDasharray={c} strokeDashoffset={o} strokeLinecap="round" style={{transform:"rotate(-90deg)",transformOrigin:"center"}}/><text x={size/2} y={size/2} textAnchor="middle" dominantBaseline="central" fontSize={size>50?15:13} fontWeight="bold" fill={color}>{score}</text></svg>}
function CustomPieTooltip(props){if(props.active&&props.payload&&props.payload.length>0){var d=props.payload[0].payload;return <div className="bg-white rounded-xl shadow-lg border border-gray-200 px-4 py-3"><div className="font-bold text-sm text-gray-700">{d.name}</div><div className="text-sm text-gray-500 mt-1">數量：<span className="font-bold text-gray-800">{d.value}{d.unit||" 組"}</span></div>{d.pct&&<div className="text-sm text-gray-500">佔比：<span className="font-bold text-gray-800">{d.pct}%</span></div>}</div>}return null}
function ConvRing({rate,size=52,color,strokeW=5}){var r=(size-strokeW*2)/2,c=2*Math.PI*r,o=c*(1-Math.min(rate,1));return <svg width={size} height={size} className="shrink-0"><circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#f3f4f6" strokeWidth={strokeW}/><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={strokeW} strokeDasharray={c} strokeDashoffset={o} strokeLinecap="round" style={{transform:"rotate(-90deg)",transformOrigin:"center"}}/><text x={size/2} y={size/2} textAnchor="middle" dominantBaseline="central" fontSize={size>44?10:9} fontWeight="bold" fill={color}>{(rate*100).toFixed(1)}%</text></svg>}

/* ═══ 改動①：MiniCompareBars 加 changeLabel prop ═══ */
function MiniCompareBars({items,accentColor,changeLabel}){if(!items||items.length===0)return null;var mx=Math.max(...items.map(b=>Math.abs(b.value||0)),1);return <div className="mt-1.5 space-y-1">{items.map((b,i)=>{var w=Math.max(Math.abs(b.value)/mx*100,2);return <div key={i} className="flex items-center gap-1.5"><div className="w-1.5 h-1.5 rounded-full shrink-0" style={{background:b.color}}/><span className="text-xs w-10 shrink-0 truncate" style={{color:b.color,fontWeight:700,fontSize:11}}>{b.label}</span><div className="flex-1 h-3 bg-white bg-opacity-60 rounded-full overflow-hidden"><div className="h-full rounded-full transition-all" style={{width:w+"%",background:accentColor||b.color,opacity:i===0?1:.4}}/></div><span className={"text-xs font-black w-16 text-right shrink-0 "+(i===0?"text-gray-700":"text-gray-400")}>{b.display}</span></div>})}<div className="flex items-center justify-end gap-1 flex-wrap">{changeLabel&&items.length>1&&<span className="text-xs text-gray-300 font-bold bg-gray-100 px-1.5 py-0.5 rounded-full mr-0.5">{changeLabel}</span>}{items.slice(1).map((b,i)=>{var pc=pctChange(items[0].value,b.value);return pc!=null?<ChangeBadge key={i} pct={pc} label={"vs"+b.label}/>:null})}</div></div>}

function MultiCompareBar({bars}){if(!bars||bars.length===0)return null;var mx=Math.max(...bars.map(b=>Math.abs(b.value||0)),1);return <div className="mt-3 bg-gray-50 rounded-xl p-3 space-y-2">{bars.map((b,i)=>{var w=Math.max(Math.abs(b.value)/mx*100,2);return <div key={i} className="flex items-center gap-2"><div className="w-2 h-2 rounded-full shrink-0" style={{background:b.color}}/><span className="text-xs font-bold w-14 shrink-0 truncate" style={{color:b.color}}>{b.label}</span><div className="flex-1 h-5 bg-gray-200 rounded-full overflow-hidden"><div className="h-full rounded-full transition-all" style={{width:w+"%",background:b.color}}/></div><span className="text-xs font-black text-gray-700 w-24 text-right shrink-0">{b.display}</span></div>})}<div className="flex items-center justify-end gap-1.5 pt-0.5 flex-wrap">{bars.slice(1).map((b,i)=>{var pc=pctChange(bars[0].value,b.value);return <ChangeBadge key={i} pct={pc} label={"vs"+b.label}/>})}</div></div>}
function MetricCompareRow({icon,name,periods,formatter,editable,onEdit}){return <div className="py-3.5 border-b border-gray-50 last:border-b-0"><div className="flex items-center gap-2 mb-2.5"><span className="text-base">{icon}</span><span className="text-sm font-bold text-gray-700 flex-1">{name}</span>{editable&&<button onClick={onEdit} className="text-gray-300 hover:text-rose-400 text-sm">✏️</button>}<div className="flex gap-1 flex-wrap justify-end">{periods.slice(1).map((p,i)=>{var pc=pctChange(periods[0].value,p.value);return <ChangeBadge key={i} pct={pc} label={"vs"+p.label}/>})}</div></div><div className="space-y-1.5">{periods.map((p,i)=>{var mx=Math.max(...periods.map(x=>Math.abs(x.value||0)),1);var w=Math.max(Math.abs(p.value)/mx*100,3);return <div key={i} className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full shrink-0" style={{background:p.color}}/><span className="text-xs font-semibold w-14 shrink-0 truncate" style={{color:p.color}}>{p.label}</span><div className="flex-1 h-5 bg-gray-100 rounded-full overflow-hidden"><div className="h-full rounded-full transition-all" style={{width:w+"%",background:p.color,opacity:i===0?1:.6}}/></div><span className={"text-xs font-black w-24 text-right shrink-0 "+(i===0?"text-gray-800":"text-gray-400")}>{formatter(p.value)}</span></div>})}</div></div>}

r vals=p.ratingRows.map(function(r){return Number(r[sk])||0}).filter(function(v){return v>0});scores[dk]=vals.length>0?+(vals.reduce(function(a,b){return a+b},0)/vals.length).toFixed(1):0});var avgVals=Object.values(scores).filter(function(v){return v>0});var avgScore=avgVals.length>0?+(avgVals.reduce(function(a,b){return a+b},0)/avgVals.length).toFixed(1):0;var mp=tAlb+tSB;return{key:p.ic+" + "+p.staff,ic:p.ic,staff:p.staff,daysWorked:p.dateSet.size,revenue:rev,bookings:bk,perCap:bk>0?Math.round(rev/bk):0,albumConv:bk>0?tAlb/bk:0,sbConv:bk>0?tSB/bk:0,conv:bk>0?mp/bk:0,avgScore:avgScore,scores:scores}}).filter(function(p){return p.daysWorked>0}).sort(function(a,b){return b.perCap-a.perCap})}

    return <div className="space-y-4"><div className="flex items-center justify-between flex-wrap gap-2"><h2 className="text-lg font-black text-gray-700">👤 同事評分</h2>{availableYears.length>0&&<YearMonthSelector selYear={selYear} selMon={selMon} years={availableYears} monthsForYear={monthsForYear} onYearChange={handleYearChange} onMonthChange={handleMonthChange}/>}</div>
    <div className="relative"><select value={sel} onChange={e=>{setSelectedStaff(e.target.value);setSelectedWeek(null)}} className="w-full appearance-none border-2 border-rose-200 rounded-xl px-4 py-3 pr-10 text-sm font-bold bg-white focus:outline-none focus:ring-2 focus:ring-rose-300 shadow-sm">{staffWithData.map(n=><option key={n} value={n}>{n}</option>)}</select><ChevronDown className="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-rose-400 pointer-events-none"/></div>
    <div className="flex gap-1.5 bg-gray-100 p-1 rounded-xl">{["day","week","month","year"].map(p=><button key={p} onClick={()=>{setStaffViewPeriod(p);setSelectedWeek(null)}} className={staffViewPeriod===p?"flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-rose-600 shadow-sm":"flex-1 py-2.5 rounded-lg text-sm font-bold text-gray-400"}>{{day:"日",week:"週",month:"月",year:"年"}[p]}</button>)}</div>{sel&&staffViewPeriod==="month"&&(()=>{var ms=getMonthlyScores(sel);if(!hasAnyScores(ms))return <EmptyState icon="⭐" title="未有評分" subtitle={"「"+sel+"」喺"+selYear+"年"+MONTH_NAMES[selMon]+"未有記錄"}/>;var mA=currentData&&currentData.staffRatings[sel]?currentData.staffRatings[sel].avg:0;var sc=getScoreColor(mA);return <div className="space-y-4"><div className={"rounded-2xl p-5 text-center border "+sc.bg+" "+sc.border}><div className="text-sm text-gray-400 mb-1">{selYear}年{MONTH_NAMES[selMon]}</div><div className={"text-5xl font-black "+sc.text}>⭐ {mA}</div><div className={"text-base font-bold mt-1 "+sc.text}>{sc.label}</div></div>{renderTripleRadar(ms)}{renderStrengthWeakness(ms)}<ICNotesSection staffName={sel} sheetData={sheetData} selYear={selYear} selMon={selMon} period="month"/></div>})()}{sel&&staffViewPeriod==="year"&&(()=>{var ys=getYearlyScores(sel);if(!hasAnyScores(ys))return <EmptyState icon="⭐" title="未有評分"/>;var yA=Object.values(ys).filter(v=>v>0);var avg=yA.length>0?+(yA.reduce((a,b)=>a+b,0)/yA.length).toFixed(1):0;var sc=getScoreColor(avg);return <div className="space-y-4"><div className={"rounded-2xl p-5 text-center border "+sc.bg+" "+sc.border}><div className="text-sm text-gray-400 mb-1">{selYear}年 年度</div><div className={"text-5xl font-black "+sc.text}>⭐ {avg}</div></div>{renderTripleRadar(ys)}{renderStrengthWeakness(ys)}<ICNotesSection staffName={sel} sheetData={sheetData} selYear={selYear} selMon={selMon} period="year"/></div>})()}{sel&&staffViewPeriod==="day"&&(()=>{if(dailyScores.length===0)return <EmptyState icon="📅" title="未有每日評分"/>;var dd=dailyScores.find(d=>d.day===selectedDay)||dailyScores[0];if(!dd)return null;var sc=getScoreColor(dd.avg);return <div className="space-y-4"><div className="overflow-x-auto"><div className="flex gap-1.5 pb-2" style={{minWidth:"max-content"}}>{dailyScores.map(d=>{var dsc=getScoreColor(d.avg);return <button key={d.day} onClick={()=>setSelectedDay(d.day)} className={selectedDay===d.day?"flex flex-col items-center px-2.5 py-2 rounded-xl bg-rose-500 text-white shadow-sm":"flex flex-col items-center px-2.5 py-2 rounded-xl bg-white border border-gray-200"} style={{minWidth:40}}><span className="text-xs font-bold">{d.day}</span><span className="text-xs font-bold" style={{color:selectedDay===d.day?"white":dsc.color}}>{d.avg}</span></button>})}</div></div><div className={"rounded-2xl p-5 text-center border "+sc.bg+" "+sc.border}><div className="text-sm text-gray-400 mb-1">{selMon}月{dd.day}日</div><div className={"text-5xl font-black "+sc.text}>⭐ {dd.avg}</div></div>{renderTripleRadar(dd.scores)}{renderStrengthWeakness(dd.scores)}</div>})()}{sel&&staffViewPeriod==="week"&&selectedWeek==null&&(()=>{if(weeks.length===0)return <EmptyState icon="📅" title="未有每週評分"/>;return <div className="space-y-3">{weeks.map(w=>{var wsc=getScoreColor(w.avg);return <button key={w.weekNum} onClick={()=>setSelectedWeek(w.weekNum)} className={"w-full text-left bg-white rounded-2xl p-4 shadow-sm border-2 hover:border-rose-300 "+wsc.border}><div className="flex items-center justify-between mb-2"><div><div className="text-base font-bold text-gray-700">第{w.weekNum}週</div><div className="text-sm text-gray-400">{selMon}月{w.startDay}日 - {w.endDay}日</div></div><CircleScore score={w.avg} color={wsc.color} size={56}/></div><div className="text-xs text-rose-400 font-bold text-right">查看明細 →</div></button>})}</div>})()}{sel&&staffViewPeriod==="week"&&selectedWeek!=null&&(()=>{var wk=weeks.find(w=>w.weekNum===selectedWeek);if(!wk)return null;var sc=getScoreColor(wk.avg);return <div className="space-y-4"><button onClick={()=>setSelectedWeek(null)} className="flex items-center gap-2 text-sm font-bold text-rose-500">← 返回</button><div className={"rounded-2xl p-5 text-center border "+sc.bg+" "+sc.border}><div className="text-sm text-gray-400">第{wk.weekNum}週（{selMon}月{wk.startDay}日 - {wk.endDay}日）</div><div className={"text-4xl font-black mt-1 "+sc.text}>⭐ {wk.avg}</div></div>{renderTripleRadar(wk.scores)}{renderStrengthWeakness(wk.scores)}</div>})()}</div>}

  function renderAnnual(){var yd=allMonths.filter(d=>d.year===selYear);if(yd.length===0)return <div className="space-y-4"><div className="flex items-center justify-between"><h2 className="text-lg font-black text-gray-700">📅 年度</h2>{availableYears.length>0&&<select value={selYear} onChange={e=>handleYearChange(parseInt(e.target.value))} className="border-2 border-pink-200 rounded-xl px-3 py-2 text-sm font-bold bg-pink-50">{availableYears.map(y=><option key={y} value={y}>{y}年</option>)}</select>}</div><EmptyState icon="📅" title="未有數據"/></div>;var tR=yd.reduce((s,d)=>s+d.revenue,0),tE=yd.reduce((s,d)=>s+d.totalEntry,0);var ly=allMonths.filter(d=>d.year===selYear-1);var lR=ly.reduce((s,d)=>s+d.revenue,0),lE=ly.reduce((s,d)=>s+d.totalEntry,0);var cd=yd.map(d=>({name:MONTH_NAMES[d.month],revenue:d.revenue}));return <div className="space-y-4"><div className="flex items-center justify-between"><h2 className="text-lg font-black text-gray-700">📅 {selYear}年</h2><select value={selYear} onChange={e=>handleYearChange(parseInt(e.target.value))} className="border-2 border-pink-200 rounded-xl px-3 py-2 text-sm font-bold bg-pink-50">{availableYears.map(y=><option key={y} value={y}>{y}年</option>)}</select></div><div className="grid grid-cols-2 gap-3"><KPICard icon="💰" label="年度營收" value={formatMoney(tR)} badges={lR>0?<MomBadge current={tR} previous={lR} prevLabel={formatMoney(lR)} tag="上年"/>:null}/><KPICard icon="🚪" label="年度 Bookings" value={formatNum(tE)+" 組"} badges={lE>0?<MomBadge current={tE} previous={lE} prevLabel={formatNum(lE)+" 組"} tag="上年"/>:null}/></div><div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><div className="font-bold text-sm text-gray-700 mb-3">📊 月營收趨勢</div><ResponsiveContainer width="100%" height={220}><AreaChart data={cd}><defs><linearGradient id="rG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#f43f5e" stopOpacity={.3}/><stop offset="100%" stopColor="#f43f5e" stopOpacity={.05}/></linearGradient></defs><CartesianGrid strokeDasharray="3 3" stroke="#f3f4f6"/><XAxis dataKey="name" tick={{fontSize:10}}/><YAxis tick={{fontSize:10}} tickFormatter={v=>Math.round(v/1000)+"k"}/><Tooltip formatter={v=>["$"+v.toLocaleString()]}/><Area type="monotone" dataKey="revenue" stroke="#f43f5e" fill="url(#rG)" strokeWidth={2.5} dot={{r:3,fill:"#f43f5e"}}/></AreaChart></ResponsiveContainer></div></div>}

  function renderYoY(){if(allMonths.length===0)return <div className="space-y-4"><h2 className="text-lg font-black text-gray-700">📈 YoY</h2><EmptyState icon="📈" title="未有數據"/></div>;var cy=selYear,ly=selYear-1;var cyMs=allMonths.filter(d=>d.year===cy),lyMs=allMonths.filter(d=>d.year===ly);var rc=[];for(var i=1;i<=12;i++){var cM=cyMs.find(d=>d.month===i),lM=lyMs.find(d=>d.month===i);rc.push({name:MONTH_NAMES[i],cur:cM?cM.revenue:0,prev:lM?lM.revenue:0})}return <div className="space-y-4"><div className="flex items-center justify-between"><h2 className="text-lg font-black text-gray-700">📈 YoY</h2><select value={selYear} onChange={e=>handleYearChange(parseInt(e.target.value))} className="border-2 border-pink-200 rounded-xl px-3 py-2 text-sm font-bold bg-pink-50">{availableYears.map(y=><option key={y} value={y}>{y}年</option>)}</select></div><div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><div className="font-bold text-sm text-gray-700 mb-3">💰 月營收 ({cy} vs {ly})</div><ResponsiveContainer width="100%" height={220}><LineChart data={rc}><CartesianGrid strokeDasharray="3 3" stroke="#f3f4f6"/><XAxis dataKey="name" tick={{fontSize:10}}/><YAxis tick={{fontSize:10}} tickFormatter={v=>Math.round(v/1000)+"k"}/><Tooltip formatter={v=>["$"+v.toLocaleString()]}/><Legend/><Line type="monotone" dataKey="cur" name={String(cy)} stroke="#f43f5e" strokeWidth={2.5} dot={{r:3,fill:"#f43f5e"}}/><Line type="monotone" dataKey="prev" name={String(ly)} stroke="#fda4af" strokeWidth={2} dot={{r:2.5,fill:"#fda4af"}} strokeDasharray="6 3"/></LineChart></ResponsiveContainer></div><div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><div className="font-bold text-sm text-gray-700 mb-3">📋 逐月對比</div><table className="w-full text-xs"><thead><tr className="bg-gray-50"><th className="p-2 text-left">月</th><th className="p-2 text-right">{cy}</th><th className="p-2 text-right">{ly}</th><th className="p-2 text-right">變化</th></tr></thead><tbody>{Array.from({length:12},(_,i2)=>{var m=i2+1,cM2=cyMs.find(d=>d.month===m),lM2=lyMs.find(d=>d.month===m);return <tr key={m} className="border-t border-gray-100"><td className="p-2 font-bold">{MONTH_NAMES[m]}</td><td className="p-2 text-right">{cM2?formatMoney(cM2.revenue):"—"}</td><td className="p-2 text-right">{lM2?formatMoney(lM2.revenue):"—"}</td><td className="p-2 text-right">{cM2&&lM2?<MomBadge current={cM2.revenue} previous={lM2.revenue}/>:"—"}</td></tr>})}</tbody></table></div></div>}

  function renderSettings(){if(!settingsUnlocked)return <PasswordGate onUnlock={()=>setSettingsUnlocked(true)}/>;return <div className="space-y-5"><div className="flex items-center justify-between"><h2 className="text-lg font-black text-gray-700">⚙️ 設定</h2><button onClick={()=>setSettingsUnlocked(false)} className="flex items-center gap-1.5 text-xs font-bold text-gray-400 bg-gray-100 px-3 py-1.5 rounded-lg hover:bg-gray-200"><Lock className="w-3.5 h-3.5"/><span>鎖定</span></button></div><div className="bg-gradient-to-r from-emerald-50 to-teal-50 rounded-xl px-4 py-2.5 border border-emerald-200 flex items-center gap-2"><Unlock className="w-4 h-4 text-emerald-500"/><span className="text-sm font-bold text-emerald-600">已解鎖</span></div><SyncStatusBadge syncing={syncing} syncOk={syncOk} syncError={syncError}/>{renderICAnalysis()}<div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><div className="flex items-center gap-2 mb-4"><div className="w-8 h-8 rounded-xl bg-gradient-to-br from-rose-400 to-pink-400 flex items-center justify-center text-white text-sm">👥</div><div><div className="font-bold text-base text-gray-700">同事名單</div><div className="text-xs text-gray-400">{staffList.length} 位</div></div></div><div className="space-y-2 mb-3">{staffList.map(n=><div key={n} className="flex items-center justify-between bg-gray-50 rounded-xl px-4 py-3"><div className="flex items-center gap-3"><div className="w-8 h-8 rounded-lg bg-gradient-to-br from-rose-400 to-pink-400 flex items-center justify-center text-white font-bold text-sm">{n[0]}</div><span className="font-semibold text-sm">{n}</span></div><button onClick={()=>handleRemoveStaff(n)} disabled={syncing} className="w-8 h-8 rounded-lg bg-red-50 text-red-400 flex items-center justify-center hover:bg-red-100 disabled:opacity-40">✕</button></div>)}</div><div className="flex gap-2"><input value={newStaffName} onChange={e=>setNewStaffName(e.target.value)} placeholder="新同事名..." className="flex-1 border-2 border-pink-200 rounded-xl px-3 py-2.5 text-sm bg-pink-50 focus:outline-none focus:ring-2 focus:ring-rose-300" onKeyDown={e=>{if(e.key==="Enter")handleAddStaff()}}/><button onClick={handleAddStaff} disabled={syncing} className="bg-gradient-to-r from-rose-400 to-pink-400 text-white font-bold px-4 py-2.5 rounded-xl shadow-sm disabled:opacity-40">+ 加</button></div></div><div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><div className="flex items-center gap-2 mb-4"><div className="w-8 h-8 rounded-xl bg-gradient-to-br from-violet-400 to-purple-400 flex items-center justify-center text-white text-sm"><Shield className="w-4 h-4"/></div><div><div className="font-bold text-base text-gray-700">IC 名單</div><div className="text-xs text-gray-400">{icList.length} 位</div></div></div><div className="space-y-2 mb-3">{icList.map(n=><div key={n} className="flex items-center justify-between bg-violet-50 rounded-xl px-4 py-3"><div className="flex items-center gap-3"><div className="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-400 to-purple-400 flex items-center justify-center text-white font-bold text-sm">{n[0]}</div><span className="font-semibold text-sm text-violet-700">{n}</span></div><button onClick={()=>handleRemoveIC(n)} disabled={syncing} className="w-8 h-8 rounded-lg bg-red-50 text-red-400 flex items-center justify-center hover:bg-red-100 disabled:opacity-40">✕</button></div>)}</div><div className="flex gap-2"><input value={newICName} onChange={e=>setNewICName(e.target.value)} placeholder="新 IC 名..." className="flex-1 border-2 border-violet-200 rounded-xl px-3 py-2.5 text-sm bg-violet-50 focus:outline-none focus:ring-2 focus:ring-violet-300" onKeyDown={e=>{if(e.key==="Enter")handleAddIC()}}/><button onClick={handleAddIC} disabled={syncing} className="bg-gradient-to-r from-violet-400 to-purple-400 text-white font-bold px-4 py-2.5 rounded-xl shadow-sm disabled:opacity-40">+ 加</button></div></div></div>}

  var TABS=[{id:"overview",icon:"📊",label:"總覽"},{id:"staff",icon:"👤",label:"同事"},{id:"details",icon:"📋",label:"明細"},{id:"annual",icon:"📅",label:"年度"},{id:"yoy",icon:"📈",label:"YoY"},{id:"settings",icon:"⚙️",label:"設定"}];
  if(loading)return <div className="min-h-screen bg-gray-50 flex items-center justify-center"><div className="text-center"><div className="text-5xl mb-4" style={{animation:"pulse 1.5s infinite"}}>👑</div><div className="text-lg font-bold text-gray-700">載入數據中...</div><div className="text-sm text-gray-400 mt-1">正在連接 Google Sheet</div></div></div>;
  return <div className="min-h-screen bg-gray-50"><div className="px-5 pt-6 pb-8 text-white relative overflow-hidden" style={{background:"linear-gradient(135deg,#f9a8d4,#fb7185,#f472b6)"}}><div className="absolute top-0 right-0 w-40 h-40 bg-white opacity-10 rounded-full" style={{transform:"translate(30px,-30px)"}}/><div className="relative max-w-2xl mx-auto"><div className="text-xs opacity-70 tracking-wider mb-1">👑 PRINCESS BEAUTY BOUTIQUE</div><div className="text-xl font-extrabold">PBBB Dashboard</div><div className="text-xs opacity-50">公主化妝廳 · 後台分析{dataSource==="real"?" · ✅ 已連接":""}</div></div></div><div className="sticky top-0 z-40 bg-white border-b border-gray-200 overflow-x-auto hideScroll"><div className="flex gap-1 px-3 py-2" style={{minWidth:"max-content"}}>{TABS.map(t=><button key={t.id} onClick={()=>setActiveTab(t.id)} className={activeTab===t.id?"px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap bg-gradient-to-r from-rose-400 to-pink-400 text-white shadow":"px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap text-gray-500 hover:bg-gray-100"}>{t.icon} {t.label}</button>)}</div></div><div className="max-w-4xl mx-auto px-4 py-5">{activeTab==="overview"&&renderOverview()}{activeTab==="staff"&&renderStaff()}{activeTab==="details"&&renderDetails()}{activeTab==="annual"&&renderAnnual()}{activeTab==="yoy"&&renderYoY()}{activeTab==="settings"&&renderSettings()}</div></div>
}
ReactDOM.createRoot(document.getElementById("root")).render(<PBBBDashboard/>);
</script>
</body>
